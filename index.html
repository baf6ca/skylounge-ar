<!DOCTYPE html>
<html>
<head>
    <title>Bosch Skylounge AR - Versão Final</title>
    <meta name="description" content="Experiência de Realidade Aumentada com coordenadas geográficas.">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #webcam { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        .ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; width: 90%; max-width: 400px; }
        .calibrate-button { padding: 14px 24px; background-color: #007BC0; color: white; border: none; border-radius: 8px; font-family: sans-serif; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
        .instructions { color: white; font-family: sans-serif; background-color: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline muted></video>

    <a-scene id="scene" vr-mode-ui="enabled: false" renderer="alpha: true; colorManagement: true;" device-orientation-permission-ui="enabled: false">
        <a-camera look-controls="touchEnabled: false"></a-camera>
        <a-entity id="world"></a-entity>
    </a-scene>

    <div class="ui-container">
        <p class="instructions">Aponte a câmera para a Caixa d'água e clique abaixo para alinhar o mapa.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        // ===================================================================
        // ========== 1. CONFIGURAÇÃO GEOGRÁFICA (SUAS COORDENADAS) ==========
        // ===================================================================
        const POV_COORDS = { lat: -22.897966, lon: -47.115815 };
        const CALIBRATION_TARGET_COORDS = { lat: -22.897553, lon: -47.113375 };

        const POINTS_OF_INTEREST = [
            { name: "Caixa d'agua\n(Ponto de Calibração)", lat: -22.897553, lon: -47.113375, color: '#FFFF00', height: 5, id: 'calibrationTarget' },
            { name: "Biofuels Competence\nCenter", lat: -22.897342, lon: -47.112256, color: '#3CB371', height: 7 },
            { name: "Test Track", lat: -22.896887, lon: -47.111570, color: '#A9A9A9', height: 8 },
            { name: "Cantina", lat: -22.898064, lon: -47.114763, color: '#9400D3', height: 5 },
            { name: "MA - Automotive\nTraining Center", lat: -22.898384, lon: -47.114872, color: '#1E90FF', height: 7 },
            { name: "PT - Power Tools", lat: -22.897240, lon: -47.115682, color: '#005691', height: 10 },
            { name: "Logistic Center", lat: -22.894913, lon: -47.115306, color: '#C71585', height: 10 },
            { name: "Preserved Area", lat: -22.896832, lon: -47.117176, color: '#228B22', height: 12 },
            { name: "VM - Vehicle Motion\nLabs", lat: -22.895896, lon: -47.114976, color: '#6A5ACD', height: 7 },
            { name: "PS - Power Solutions", lat: -22.895686, lon: -47.112905, color: '#FF4500', height: 10 },
            { name: "EM - Electrification\nShowroom", lat: -22.896867, lon: -47.114718, color: '#00CED1', height: 8 },
            { name: "SMAG", lat: -22.896846, lon: -47.113732, color: '#FFD700', height: 6 },
            { name: "MA - Mobility\nAftermarket", lat: -22.895945, lon: -47.116061, color: '#ADD8E6', height: 7 },
            { name: "Galvanic", lat: -22.895672, lon: -47.114027, color: '#DA70D6', height: 7 },
            { name: "Bosch Digital, Human\nResources, Service\nSolutions, Bosch\nTraining Center,\nAmbulatory", lat: -22.897929, lon: -47.113593, color: '#87CEEB', height: 6 }
        ];

        // ===================================================================
        // =========== 2. CÁLCULOS GEOMÉTRICOS E CRIAÇÃO DO MUNDO ==========
        // ===================================================================
        function getBearingAndDistance(start, end) {
            const R = 6371e3;
            const lat1 = start.lat * Math.PI / 180, lat2 = end.lat * Math.PI / 180;
            const deltaLon = (end.lon - start.lon) * Math.PI / 180;
            const x = Math.cos(lat2) * Math.sin(deltaLon);
            const y = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(deltaLon);
            let bearing = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
            const a = Math.sin((lat2-lat1)/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(deltaLon/2)**2;
            const distance = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return { bearing, distance };
        }

        function toXZ(distance, bearing) {
            const angleRad = bearing * Math.PI / 180;
            return { x: distance * Math.sin(angleRad), z: -distance * Math.cos(angleRad) };
        }
        
        function createPois() {
            const world = document.getElementById('world');
            POINTS_OF_INTEREST.forEach(poi => {
                const { bearing, distance } = getBearingAndDistance(POV_COORDS, poi);
                const { x, z } = toXZ(distance, bearing);

                let entity = document.createElement('a-entity');
                if (poi.id) entity.id = poi.id;
                entity.setAttribute('position', `${x} 0 ${z}`);
                
                // --- MULTIPLICADOR DE ESCALA INTELIGENTE ---
                // Quanto mais distante (Z maior), maior será o multiplicador de tamanho das placas!
                const scaleFactor = Math.max(1, distance / 18); // Normaliza o tamanho confortavelmente para a tela do celular
                
                let textEl = document.createElement('a-text');
                textEl.setAttribute('value', poi.name);
                textEl.setAttribute('align', 'center');
                textEl.setAttribute('color', 'white');
                textEl.setAttribute('width', 15 * scaleFactor); // Escala dinâmica do texto
                textEl.setAttribute('wrap-count', poi.name.length > 25 ? 20 : 25);
                textEl.setAttribute('position', `0 ${poi.height + (1.2 * scaleFactor)} 0.1`);

                let planeEl = document.createElement('a-plane');
                // Alarga os painéis baseado no multiplicador para nunca cortar o texto
                planeEl.setAttribute('width', 5.5 * scaleFactor); 
                planeEl.setAttribute('height', (poi.name.split('\n').length * 0.7 + 0.5) * scaleFactor); 
                planeEl.setAttribute('position', `0 ${poi.height + (1.2 * scaleFactor)} 0`);
                planeEl.setAttribute('color', 'black');
                planeEl.setAttribute('opacity', '0.8');

                let lineEl = document.createElement('a-cylinder');
                lineEl.setAttribute('height', poi.height);
                lineEl.setAttribute('radius', 0.05 * scaleFactor); // Linhas grossas proporcionais à distância
                lineEl.setAttribute('color', poi.color);
                lineEl.setAttribute('position', `0 ${poi.height / 2} 0`);
                
                entity.appendChild(planeEl);
                entity.appendChild(textEl);
                entity.appendChild(lineEl);
                world.appendChild(entity);
            });
        }
        
        createPois();

        // ===================================================================
        // =============== 3. LÓGICA DA CÂMERA E CALIBRAÇÃO ================
        // ===================================================================
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { alert("Ative a câmera para rodar a experiência de AR."); });

        const referenceBearing = getBearingAndDistance(POV_COORDS, CALIBRATION_TARGET_COORDS).bearing;

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(p => { if (p === 'granted') calibrate(); }).catch(console.error);
            } else { calibrate(); }
        });

        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            if (camera && camera.object3D) {
                const currentYRotation = camera.object3D.rotation.y;
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                const offset = referenceBearing - currentHeading;
                world.setAttribute('rotation', `0 ${offset} 0`);
                document.querySelector('.ui-container').style.display = 'none';
                const calTarget = document.getElementById('calibrationTarget');
                if (calTarget) calTarget.parentNode.removeChild(calTarget);
            }
        }
    </script>
</body>
</html>

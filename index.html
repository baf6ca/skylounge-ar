<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bosch Skylounge AR</title>
    <meta name="description" content="Experiência de Realidade Aumentada no Skylounge da Bosch.">
    <!-- Importa a biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #webcam { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        .ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; width: 90%; max-width: 400px; }
        .calibrate-button { padding: 14px 24px; background-color: #007BC0; color: white; border: none; border-radius: 8px; font-family: sans-serif; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
        .instructions { color: white; font-family: sans-serif; background-color: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline muted></video>

    <a-scene vr-mode-ui="enabled: false" renderer="alpha: true" device-orientation-permission-ui="enabled: false">
        <a-camera look-controls="touchEnabled: false"></a-camera>

        <a-entity id="world">
            
            <!-- 📌 PONTO DE REFERÊNCIA (CALIBRAÇÃO) - SUMIRÁ APÓS CLICAR -->
            <a-entity id="calibrationTarget" position="0 1.5 -50">
                <a-text 
                    value="[Mire na Caixa d'agua e clique abaixo]" 
                    align="center" 
                    color="yellow" 
                    width="35" 
                    position="0 0.5 0.1"
                    geometry="primitive: plane; width: 12; height: 2" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>

            <!-- ======================================================= -->
            <!-- ======== PONTOS DE INTERESSE COM AUTO-LAYOUT ========= -->
            <!-- ======================================================= -->

            <!-- Test Track -->
            <a-entity position="-70 1 -120">
                <a-text 
                    value="Test Track" 
                    align="center" 
                    color="white" 
                    width="45" 
                    geometry="primitive: plane; width: 9; height: 2.2" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>

            <!-- Biofuels Competence Center -->
            <a-entity position="-10 2 -70">
                <a-text 
                    value="Biofuels Competence Center" 
                    align="center" 
                    color="white" 
                    width="35" 
                    wrap-count="20"
                    geometry="primitive: plane; width: 13; height: 2.8" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>
            
            <!-- Cantina -->
            <a-entity position="25 0 -50">
                <a-text 
                    value="Cantina" 
                    align="center" 
                    color="white" 
                    width="45" 
                    geometry="primitive: plane; width: 8; height: 2.2" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>

            <!-- MA - Automotive Training Center -->
            <a-entity position="60 0 -70">
                <a-text 
                    value="MA - Automotive\nTraining Center" 
                    align="center" 
                    color="white" 
                    width="35" 
                    wrap-count="22"
                    geometry="primitive: plane; width: 12; height: 2.8" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>

            <!-- PT - Power Tools -->
            <a-entity position="-100 0 -100">
                <a-text 
                    value="PT - Power Tools" 
                    align="center" 
                    color="white" 
                    width="45" 
                    geometry="primitive: plane; width: 11; height: 2.2" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>

            <!-- Logistic Center -->
            <a-entity position="-120 2 -150">
                <a-text 
                    value="Logistic Center" 
                    align="center" 
                    color="white" 
                    width="50" 
                    geometry="primitive: plane; width: 12; height: 2.2" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>
            
            <!-- Preserved Area -->
            <a-entity position="-150 5 -100">
                <a-text 
                    value="Preserved Area" 
                    align="center" 
                    color="white" 
                    width="50" 
                    geometry="primitive: plane; width: 12; height: 2.2" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>

            <!-- VM - Vehicle Motion (Labs) -->
            <a-entity position="30 2 -80">
                <a-text 
                    value="VM - Vehicle\nMotion Labs" 
                    align="center" 
                    color="white" 
                    width="35" 
                    wrap-count="20"
                    geometry="primitive: plane; width: 12; height: 2.8" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>
            
            <!-- PS - Power Solutions -->
            <a-entity position="40 5 -150">
                <a-text 
                    value="PS - Power Solutions" 
                    align="center" 
                    color="white" 
                    width="50" 
                    geometry="primitive: plane; width: 13; height: 2.2" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>
            
            <!-- EM - Electrification Showroom -->
            <a-entity position="50 0 -90">
                <a-text 
                    value="EM - Electrification\nShowroom" 
                    align="center" 
                    color="white" 
                    width="35" 
                    wrap-count="22"
                    geometry="primitive: plane; width: 12; height: 2.8" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>

            <!-- SMAG -->
            <a-entity position="80 0 -95">
                <a-text 
                    value="SMAG" 
                    align="center" 
                    color="white" 
                    width="45" 
                    geometry="primitive: plane; width: 8; height: 2.2" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>

            <!-- MA - Mobility Aftermarket -->
            <a-entity position="70 0 -60">
                <a-text 
                    value="MA - Mobility\nAftermarket" 
                    align="center" 
                    color="white" 
                    width="35" 
                    wrap-count="22"
                    geometry="primitive: plane; width: 12; height: 2.8" 
                    material="color: black; opacity: 0.8">
                </a-text>
            </a-entity>

        </a-entity>
    </a-scene>

    <div class="ui-container">
        <p class="instructions">Aponte a câmera para a Caixa d'água e clique abaixo para alinhar o mapa.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => {
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                video.play();
            }).catch(err => { alert("Ative a câmera para rodar a experiência de AR."); });

        const REFERENCE_HEADING = 100;

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permissionState => {
                    if (permissionState === 'granted') calibrate();
                }).catch(console.error);
            } else {
                calibrate();
            }
        });

        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            if (camera && camera.object3D) {
                const currentYRotation = camera.object3D.rotation.y;
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                
                const offset = REFERENCE_HEADING + currentHeading - 90;
                
                world.setAttribute('rotation', `0 ${offset} 0`);
                
                // --- NOVIDADES APÓS A CALIBRAÇÃO ---
                // 1. Esconde a interface inferior (botão e instruções)
                document.querySelector('.ui-container').style.display = 'none';
                
                // 2. Remove o balão amarelo da Caixa d'água da tela!
                const calTarget = document.getElementById('calibrationTarget');
                if(calTarget) {
                    calTarget.parentNode.removeChild(calTarget);
                }
            } else {
                alert("Carregando sensores... Tente de novo em 2 segundos.");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bosch Skylounge AR - Versão Final</title>
    <meta name="description" content="Experiência de Realidade Aumentada no Skylounge da Bosch.">
    
    <!-- 1. Importa a biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <!-- 2. IMPORTA O SCRIPT OFICIAL DO COMPONENTE LOOK-AT (O SEGREDO DO SUCESSO!) -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #webcam { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        .ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; width: 90%; max-width: 400px; }
        .calibrate-button { padding: 14px 24px; background-color: #007BC0; color: white; border: none; border-radius: 8px; font-family: sans-serif; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
        .instructions { color: white; font-family: sans-serif; background-color: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline muted></video>

    <a-scene id="scene" vr-mode-ui="enabled: false" renderer="alpha: true" device-orientation-permission-ui="enabled: false">
        <!-- A câmera agora tem a ID "user-camera" -->
        <a-camera id="user-camera" look-controls="touchEnabled: false"></a-camera>
        <a-entity id="world"></a-entity>
    </a-scene>

    <div class="ui-container">
        <p class="instructions">Aponte a câmera para a Caixa d'água e clique abaixo para alinhar o mapa.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        // ===================================================================
        // ========== 3. CONFIGURAÇÃO GEOGRÁFICA (SUAS COORDENADAS) ==========
        // ===================================================================
        const POV_COORDS = { lat: -22.897966, lon: -47.115815 };
        const CALIBRATION_TARGET_COORDS = { lat: -22.897553, lon: -47.113375 };
        
        const POINTS_OF_INTEREST = [
            { name: "Caixa d'agua\n(Calibração)", lat: -22.897553, lon: -47.113375, color: '#FFFF00', height: 5, scale: 1.0, id: 'calibrationTarget' },
            { name: "Biofuels Competence\nCenter", lat: -22.897342, lon: -47.112256, color: '#3CB371', height: 7, scale: 1.2 },
            { name: "Test Track", lat: -22.896887, lon: -47.111570, color: '#A9A9A9', height: 8, scale: 1.5 },
            { name: "Cantina", lat: -22.898064, lon: -47.114763, color: '#9400D3', height: 5, scale: 0.9 },
            { name: "MA - Automotive\nTraining Center", lat: -22.898384, lon: -47.114872, color: '#1E90FF', height: 7, scale: 1.0 },
            { name: "PT - Power Tools", lat: -22.897240, lon: -47.115682, color: '#005691', height: 10, scale: 1.1 },
            { name: "Logistic Center", lat: -22.894913, lon: -47.115306, color: '#C71585', height: 10, scale: 1.4 },
            { name: "Preserved Area", lat: -22.896832, lon: -47.117176, color: '#228B22', height: 12, scale: 1.2 },
            { name: "VM - Vehicle Motion\nLabs", lat: -22.895896, lon: -47.114976, color: '#6A5ACD', height: 7, scale: 1.3 },
            { name: "PS - Power Solutions", lat: -22.895686, lon: -47.112905, color: '#FF4500', height: 10, scale: 1.4 },
            { name: "EM - Electrification\nShowroom", lat: -22.896867, lon: -47.114718, color: '#00CED1', height: 8, scale: 1.1 },
            { name: "SMAG", lat: -22.896846, lon: -47.113732, color: '#FFD700', height: 6, scale: 1.2 },
            { name: "MA - Mobility\nAftermarket", lat: -22.895945, lon: -47.116061, color: '#ADD8E6', height: 7, scale: 1.3 },
            { name: "Galvanic", lat: -22.895672, lon: -47.114027, color: '#DA70D6', height: 7, scale: 1.4 },
            { name: "Bosch Digital, Human\nResources, Service\nSolutions, Bosch\nTraining Center,\nAmbulatory", lat: -22.897929, lon: -47.113593, color: '#87CEEB', height: 6, scale: 1.0 }
        ];
        
        // ===================================================================
        // =========== 4. CÁLCULOS GEOMÉTRICOS E CRIAÇÃO DO MUNDO ==========
        // ===================================================================
        function getBearingAndDistance(start, end) { 
            const R = 6371e3; 
            const lat1 = start.lat * Math.PI / 180, lat2 = end.lat * Math.PI / 180; 
            const dLon = (end.lon - start.lon) * Math.PI / 180;
            const x = Math.cos(lat2) * Math.sin(dLon); 
            const y = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            let bearing = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
            const a = Math.sin((lat2-lat1)/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon/2)**2;
            const distance = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return { bearing, distance };
        }
        
        function toXZ(d, b) { 
            const a = b * Math.PI / 180; 
            return { x: d * Math.sin(a), z: -d * Math.cos(a) }; 
        }

        function createPois() {
            const world = document.getElementById('world');
            POINTS_OF_INTEREST.forEach(poi => {
                const { bearing, distance } = getBearingAndDistance(POV_COORDS, poi);
                const { x, z } = toXZ(distance, bearing);

                let entity = document.createElement('a-entity');
                if (poi.id) entity.id = poi.id;
                entity.setAttribute('position', `${x} 0 ${z}`);
                
                // --- Billboard Dinâmico usando o componente 'look-at' importado ---
                let billboard = document.createElement('a-entity');
                billboard.setAttribute('look-at', '#user-camera'); // Força a olhar nativamente para a câmera!
                billboard.setAttribute('position', `0 ${poi.height} 0`);
                
                const scale = Math.max(1, distance / 50) * poi.scale;

                let textEl = document.createElement('a-text');
                textEl.setAttribute('value', poi.name);
                textEl.setAttribute('align', 'center');
                textEl.setAttribute('color', 'white');
                textEl.setAttribute('width', 15 * scale);
                textEl.setAttribute('wrap-count', poi.name.length > 25 ? 20 : 30);
                textEl.setAttribute('position', '0 0 0.1');

                let planeEl = document.createElement('a-plane');
                planeEl.setAttribute('width', 5.5 * scale);
                planeEl.setAttribute('height', (poi.name.split('\n').length * 0.5 + 0.4) * scale);
                planeEl.setAttribute('color', 'black');
                planeEl.setAttribute('opacity', '0.7');

                // --- Linha (Cilindro robusto fixo no chão) ---
                let lineEl = document.createElement('a-cylinder');
                lineEl.setAttribute('height', poi.height);
                lineEl.setAttribute('radius', 0.12 * scale); // Linha bem visível e grossa
                lineEl.setAttribute('color', poi.color);
                lineEl.setAttribute('position', `0 ${poi.height / 2} 0`);
                
                billboard.appendChild(planeEl);
                billboard.appendChild(textEl);
                entity.appendChild(billboard);
                entity.appendChild(lineEl);
                world.appendChild(entity);
            });
        }
        
        createPois();

        // ===================================================================
        // =============== 5. LÓGICA DA CÂMERA E CALIBRAÇÃO ================
        // ===================================================================
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { alert("Ative a câmera para rodar a experiência de AR."); });

        const referenceBearing = getBearingAndDistance(POV_COORDS, CALIBRATION_TARGET_COORDS).bearing;

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(p => { if (p === 'granted') calibrate(); }).catch(console.error);
            } else { calibrate(); }
        });

        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            if (camera && camera.object3D) {
                const currentYRotation = camera.object3D.rotation.y;
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                const offset = referenceBearing - currentHeading;
                world.setAttribute('rotation', `0 ${offset} 0`);
                document.querySelector('.ui-container').style.display = 'none';
                const calTarget = document.getElementById('calibrationTarget');
                if (calTarget) calTarget.parentNode.removeChild(calTarget);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Bosch Skylounge AR</title>
    <meta name="description" content="Experiência de Realidade Aumentada no Skylounge da Bosch.">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #webcam { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        .ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; width: 90%; max-width: 400px; }
        .calibrate-button { padding: 14px 24px; background-color: #007BC0; color: white; border: none; border-radius: 8px; font-family: sans-serif; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
        .instructions { color: white; font-family: sans-serif; background-color: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline muted></video>

    <a-scene vr-mode-ui="enabled: false" renderer="alpha: true" device-orientation-permission-ui="enabled: false">
        <a-camera look-controls="touchEnabled: false"></a-camera>

        <a-entity id="world">
            
            <!-- PONTO DE REFERÊNCIA (CALIBRAÇÃO) -->
            <a-entity position="0 1.5 -50">
                <a-text value="[Mire na Caixa d'agua e clique abaixo]" align="center" color="yellow" width="22" position="0 0.5 0.1"></a-text>
                <a-plane color="black" width="10" height="2" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>

            <!-- ======================================================= -->
            <!-- ======== PONTOS DE INTERESSE COM NOVO LAYOUT ======== -->
            <!-- ======================================================= -->

            <!-- Test Track -->
            <a-entity position="-70 1 -120">
                <a-text value="Test Track" align="center" color="white" width="20" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="6" height="1.5" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>

            <!-- Biofuels Competence Center -->
            <a-entity position="-10 2 -70">
                <a-text value="Biofuels Competence Center" align="center" color="white" width="15" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="9" height="1.5" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>
            
            <!-- Cantina -->
            <a-entity position="25 0 -50">
                <a-text value="Cantina" align="center" color="white" width="20" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="5" height="1.5" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>

            <!-- MA - Automotive Training Center -->
            <a-entity position="60 0 -70">
                <a-text value="MA - Automotive Training Center" wrap-count="30" align="center" color="white" width="15" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="10" height="2" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>

            <!-- PT - Power Tools -->
            <a-entity position="-100 0 -100">
                <a-text value="PT - Power Tools" align="center" color="white" width="25" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="8" height="1.5" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>

            <!-- Logistic Center -->
            <a-entity position="-120 2 -150">
                <a-text value="Logistic Center" align="center" color="white" width="25" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="8" height="1.5" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>
            
            <!-- Preserved Area -->
            <a-entity position="-150 5 -100">
                <a-text value="Preserved Area" align="center" color="white" width="25" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="8" height="1.5" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>

            <!-- VM - Vehicle Motion (Labs) -->
            <a-entity position="30 2 -80">
                <a-text value="VM - Vehicle Motion Labs" wrap-count="30" align="center" color="white" width="15" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="10" height="2" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>
            
            <!-- PS - Power Solutions -->
            <a-entity position="40 5 -150">
                <a-text value="PS - Power Solutions" align="center" color="white" width="25" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="9" height="1.5" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>
            
            <!-- EM - Electrification Showroom -->
            <a-entity position="50 0 -90">
                <a-text value="EM - Electrification Showroom" wrap-count="30" align="center" color="white" width="15" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="10" height="2" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>

            <!-- SMAG -->
            <a-entity position="80 0 -95">
                <a-text value="SMAG" align="center" color="white" width="20" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="4" height="1.5" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>

            <!-- MA - Mobility Aftermarket -->
            <a-entity position="70 0 -60">
                <a-text value="MA - Mobility Aftermarket" wrap-count="30" align="center" color="white" width="15" position="0 0.2 0.1"></a-text>
                <a-plane color="black" width="10" height="2" position="0 0 0" opacity="0.8"></a-plane>
            </a-entity>

        </a-entity>
    </a-scene>

    <div class="ui-container">
        <p class="instructions">Aponte a câmera para a Caixa d'água e clique abaixo para alinhar o mapa.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => {
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                video.play();
            }).catch(err => { alert("Ative a câmera para rodar a experiência de AR."); });

        const REFERENCE_HEADING = 100;

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permissionState => {
                    if (permissionState === 'granted') calibrate();
                }).catch(console.error);
            } else {
                calibrate();
            }
        });

        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            if (camera && camera.object3D) {
                const currentYRotation = camera.object3D.rotation.y;
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                
                // === AJUSTE DE 90 GRAUS APLICADO AQUI ===
                const offset = REFERENCE_HEADING + currentHeading + 90;
                
                world.setAttribute('rotation', `0 ${offset} 0`);
                document.querySelector('.ui-container').style.display = 'none';
            } else {
                alert("Carregando sensores... Tente de novo em 2 segundos.");
            }
        }
    </script>
</body>
</html>

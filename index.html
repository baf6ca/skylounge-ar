<!DOCTYPE html>
<html>
<head>
    <title>Bosch Skylounge AR</title>
    <meta name="description" content="Experiência de Realidade Aumentada no Skylounge da Bosch.">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #webcam { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        .ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; width: 90%; max-width: 400px; }
        .calibrate-button { padding: 14px 24px; background-color: #007BC0; color: white; border: none; border-radius: 8px; font-family: sans-serif; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
        .instructions { color: white; font-family: sans-serif; background-color: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline muted></video>

    <a-scene vr-mode-ui="enabled: false" renderer="alpha: true; colorManagement: true;" device-orientation-permission-ui="enabled: false">
        <a-camera look-controls="touchEnabled: false"></a-camera>

        <a-entity id="world">
            
            <a-entity id="calibrationTarget" position="0 1.5 -50">
                <a-text value="[Mire na Caixa d'agua e clique abaixo]" align="center" color="yellow" width="30" label-with-line="lineHeight: 3; lineColor: yellow;"></a-text>
            </a-entity>

            <!-- =================================================================== -->
            <!-- ======== PONTOS DE INTERESSE COM LINHAS INDICATIVAS ========= -->
            <!-- =================================================================== -->
            
            <!-- A POSIÇÃO DA <a-entity> AGORA É O PONTO FINAL DA LINHA (NO PRÉDIO) -->

            <a-entity position="-70 1 -120" label-with-line="text: Test Track; width: 40; lineHeight: 8; lineColor: #A9A9A9;"></a-entity>
            <a-entity position="-10 2 -70" label-with-line="text: Biofuels Competence Center; width: 25; wrapCount: 25; lineHeight: 6; lineColor: #3CB371;"></a-entity>
            <a-entity position="25 0 -50" label-with-line="text: Cantina; width: 30; lineHeight: 5; lineColor: #9400D3;"></a-entity>
            <a-entity position="60 0 -70" label-with-line="text: MA - Automotive Training Center; width: 25; wrapCount: 25; lineHeight: 7; lineColor: #1E90FF;"></a-entity>
            <a-entity position="-100 0 -100" label-with-line="text: PT - Power Tools; width: 40; lineHeight: 10; lineColor: #005691;"></a-entity>
            <a-entity position="-120 2 -150" label-with-line="text: Logistic Center; width: 40; lineHeight: 10; lineColor: #C71585;"></a-entity>
            <a-entity position="-150 5 -100" label-with-line="text: Preserved Area; width: 40; lineHeight: 12; lineColor: #228B22;"></a-entity>
            <a-entity position="30 2 -80" label-with-line="text: VM - Vehicle Motion Labs; width: 25; wrapCount: 25; lineHeight: 7; lineColor: #6A5ACD;"></a-entity>
            <a-entity position="40 5 -150" label-with-line="text: PS - Power Solutions; width: 40; lineHeight: 10; lineColor: #FF4500;"></a-entity>
            <a-entity position="50 0 -90" label-with-line="text: EM - Electrification Showroom; width: 25; wrapCount: 25; lineHeight: 8; lineColor: #00CED1;"></a-entity>
            <a-entity position="80 0 -95" label-with-line="text: SMAG; width: 30; lineHeight: 6; lineColor: #FFD700;"></a-entity>
            <a-entity position="70 0 -60" label-with-line="text: MA - Mobility Aftermarket; width: 25; wrapCount: 25; lineHeight: 7; lineColor: #ADD8E6;"></a-entity>

        </a-entity>
    </a-scene>

    <div class="ui-container">
        <p class="instructions">Aponte a câmera para a Caixa d'água e clique abaixo para alinhar o mapa.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        // NOVO COMPONENTE INTELIGENTE: label-with-line
        AFRAME.registerComponent('label-with-line', {
            schema: {
                text: {type: 'string', default: ''},
                width: {type: 'number', default: 30},
                wrapCount: {type: 'number', default: 30},
                lineHeight: {type: 'number', default: 5},
                lineColor: {type: 'color', default: 'white'}
            },
            init: function () {
                var data = this.data;
                var el = this.el;

                // Cria o elemento de texto
                var textEl = document.createElement('a-text');
                textEl.setAttribute('value', data.text);
                textEl.setAttribute('align', 'center');
                textEl.setAttribute('color', 'white');
                textEl.setAttribute('width', data.width);
                textEl.setAttribute('wrap-count', data.wrapCount);
                
                // Posiciona o texto acima do ponto de ancoragem
                textEl.setAttribute('position', `0 ${data.lineHeight + 1} 0`);
                el.appendChild(textEl);

                // Espera o texto ser renderizado para criar o fundo e a linha
                textEl.addEventListener('text-rendered', (evt) => {
                    var textMesh = textEl.getObject3D('text');
                    if (!textMesh) return;

                    var box = new THREE.Box3().setFromObject(textMesh);
                    var textWidth = box.max.x - box.min.x;
                    var textHeight = box.max.y - box.min.y;
                    var padding = 0.3;

                    // Cria o plano de fundo
                    var background = new THREE.Mesh(
                        new THREE.PlaneGeometry(textWidth + padding, textHeight + padding),
                        new THREE.MeshBasicMaterial({ color: 'black', transparent: true, opacity: 0.7 })
                    );
                    
                    var center = box.getCenter(new THREE.Vector3());
                    background.position.copy(center);
                    background.position.z = -0.01;
                    textEl.object3D.add(background);

                    // Cria a linha conectora
                    var line = document.createElement('a-cylinder');
                    line.setAttribute('height', data.lineHeight);
                    line.setAttribute('radius', '0.03');
                    line.setAttribute('color', data.lineColor);
                    // Posiciona a linha para conectar o chão ao texto
                    line.setAttribute('position', `0 ${data.lineHeight / 2} 0`);
                    el.appendChild(line);
                });
            }
        });

        // --- CÓDIGO DE CÂMERA E CALIBRAÇÃO ---
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => {
                document.getElementById('webcam').srcObject = stream;
            }).catch(err => { alert("Ative a câmera para rodar a experiência de AR."); });

        const REFERENCE_HEADING = 100;

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(p => { if (p === 'granted') calibrate(); }).catch(console.error);
            } else { calibrate(); }
        });

        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            if (camera && camera.object3D) {
                const currentYRotation = camera.object3D.rotation.y;
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                const offset = REFERENCE_HEADING + currentHeading - 90;
                world.setAttribute('rotation', `0 ${offset} 0`);
                document.querySelector('.ui-container').style.display = 'none';
                const calTarget = document.getElementById('calibrationTarget');
                if (calTarget) calTarget.parentNode.removeChild(calTarget);
            }
        }
    </script>
</body>
</html>

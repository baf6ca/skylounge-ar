<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bosch Skylounge AR - Controle Manual</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #webcam { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        .poi-label {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            white-space: pre-line;
            text-align: center;
            pointer-events: none;
            z-index: 5;
            transform: translate(-50%, -100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            display: none;
        }
        #svg-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; }
        .ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; width: 90%; max-width: 400px; }
        .calibrate-button { padding: 14px 24px; background-color: #007BC0; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
        .instructions { color: white; background-color: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline muted></video>
    <svg id="svg-overlay"></svg>
    <div id="labels-container"></div>
    <a-scene id="scene" vr-mode-ui="enabled: false" renderer="alpha: true" device-orientation-permission-ui="enabled: false">
        <a-camera id="user-camera" look-controls="touchEnabled: false"></a-camera>
        <a-entity id="world"></a-entity>
    </a-scene>
    <div class="ui-container">
        <p class="instructions">Aponte a câmera para a Caixa d'água e clique abaixo para alinhar o mapa.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        const POV_COORDS = { lat: -22.897966, lon: -47.115815 };
        const CALIBRATION_TARGET_COORDS = { lat: -22.897553, lon: -47.113375 };
        
        // --- CONTROLE MANUAL DE ALTURA ---
        const POINTS_OF_INTEREST = [
            { name: "Caixa d'agua\n(Calibração)", lat: -22.897553, lon: -47.113375, color: '#FFFF00', height: 8, id: 'calibrationTarget' },
            { name: "Biofuels Competence\nCenter", lat: -22.897342, lon: -47.112256, color: '#3CB371', height: 16 },
            { name: "Test Track", lat: -22.896887, lon: -47.111570, color: '#A9A9A9', height: 25 },
            { name: "Cantina", lat: -22.898064, lon: -47.114763, color: '#9400D3', height: 0.5 },
            { name: "MA - Automotive\nTraining Center", lat: -22.898384, lon: -47.114872, color: '#1E90FF', height: 4.5 },
            { name: "PT - Power Tools", lat: -22.897242, lon: -47.115679, color: '#005691', height: 0,5 },
            { name: "Logistic Center", lat: -22.894913, lon: -47.115306, color: '#C71585', height: 22 },
            { name: "Preserved Area", lat: -22.896832, lon: -47.117176, color: '#228B22', height: 9 },
            { name: "VM - Vehicle Motion\nLabs", lat: -22.895896, lon: -47.114976, color: '#6A5ACD', height: 18 },
            { name: "PS - Power Solutions", lat: -22.895686, lon: -47.112905, color: '#FF4500', height: 20 },
            { name: "EM - Electrification\nShowroom", lat: -22.896867, lon: -47.114718, color: '#00CED1', height: 12 },
            { name: "SMAG", lat: -22.896846, lon: -47.113732, color: '#FFD700', height: 14 },
            { name: "MA - Mobility\nAftermarket", lat: -22.897000, lon: -47.115500, color: '#ADD8E6', height: 7 },
            { name: "Galvanic", lat: -22.895672, lon: -47.114027, color: '#DA70D6', height: 17 },
            { name: "Bosch Digital\nHuman Resources\nService Solutions\nBosch Training Center\nAmbulatory", lat: -22.897929, lon: -47.113593, color: '#87CEEB', height: 6 }
        ];

        // --- CÓDIGO DE LÓGICA (SEM ALTERAÇÕES) ---
        function getBearingAndDistance(start, end) { /* ... */ 
            const R = 6371e3; const lat1 = start.lat * Math.PI / 180, lat2 = end.lat * Math.PI / 180; const dLon = (end.lon - start.lon) * Math.PI / 180;
            const x = Math.cos(lat2) * Math.sin(dLon); const y = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            let bearing = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
            const a = Math.sin((lat2-lat1)/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon/2)**2;
            return { bearing, distance: R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)) };
        }
        function toXZ(d, b) { const a = b * Math.PI / 180; return { x: d * Math.sin(a), z: -d * Math.cos(a) }; }
        const poisInScene = [];
        function createPois() {
            const world = document.getElementById('world');
            const labelsContainer = document.getElementById('labels-container');
            POINTS_OF_INTEREST.forEach((poi, index) => {
                const { bearing, distance } = getBearingAndDistance(POV_COORDS, poi);
                const { x, z } = toXZ(distance, bearing);
                let anchor = document.createElement('a-entity');
                anchor.setAttribute('position', `${x} 0 ${z}`);
                if (poi.id) anchor.id = poi.id;
                let tip = document.createElement('a-entity');
                tip.setAttribute('position', `0 ${poi.height} 0`); // USA A ALTURA MANUAL
                anchor.appendChild(tip);
                world.appendChild(anchor);
                let labelDiv = document.createElement('div');
                labelDiv.className = 'poi-label';
                labelDiv.id = `label-${index}`;
                labelDiv.textContent = poi.name;
                labelsContainer.appendChild(labelDiv);
                poisInScene.push({ anchorEl: anchor, tipEl: tip, label2D: labelDiv, color: poi.color, isCalTarget: !!poi.id });
            });
        }
        createPois();
        const sceneEl = document.getElementById('scene');
        const svgEl = document.getElementById('svg-overlay');
        const cameraEl = document.getElementById('user-camera');
        let cameraThree, widthHalf, heightHalf;
        sceneEl.addEventListener('render-target-loaded', () => { cameraThree = cameraEl.getObject3D('camera'); });
        function updatePositions() {
            if (!cameraThree) { cameraThree = cameraEl.getObject3D('camera'); }
            if (!cameraThree || poisInScene.length === 0) { requestAnimationFrame(updatePositions); return; }
            const width = window.innerWidth, height = window.innerHeight;
            widthHalf = width / 2; heightHalf = height / 2;
            svgEl.innerHTML = '';
            poisInScene.forEach(poi => {
                const anchor3D = poi.anchorEl.object3D;
                const tip3D = poi.tipEl.object3D;
                if (!anchor3D || !tip3D) return;
                anchor3D.updateMatrixWorld(true);
                tip3D.updateMatrixWorld(true);
                let posAnchor = new THREE.Vector3().setFromMatrixPosition(anchor3D.matrixWorld);
                let posTip = new THREE.Vector3().setFromMatrixPosition(tip3D.matrixWorld);
                let tempV = posAnchor.clone().project(cameraThree);
                if (tempV.z < 1) {
                    let anchor2D = projectToScreen(posAnchor);
                    let tip2D = projectToScreen(posTip);
                    poi.label2D.style.display = 'block';
                    poi.label2D.style.left = `${tip2D.x}px`;
                    poi.label2D.style.top = `${tip2D.y}px`;
                    let svgLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    svgLine.setAttribute('x1', anchor2D.x); svgLine.setAttribute('y1', anchor2D.y);
                    svgLine.setAttribute('x2', tip2D.x); svgLine.setAttribute('y2', tip2D.y);
                    svgLine.setAttribute('stroke', poi.color);
                    svgLine.setAttribute('stroke-width', '8');
                    svgLine.setAttribute('stroke-linecap', 'round');
                    svgEl.appendChild(svgLine);
                } else { poi.label2D.style.display = 'none'; }
            });
            requestAnimationFrame(updatePositions);
        }
        function projectToScreen(vec3) { let p = vec3.clone().project(cameraThree); return { x: (p.x * widthHalf) + widthHalf, y: -(p.y * heightHalf) + heightHalf }; }
        requestAnimationFrame(updatePositions);
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => { document.getElementById('webcam').srcObject = stream; document.getElementById('webcam').play(); })
            .catch(err => { alert("Ative a câmera para rodar a experiência de AR."); });
        const referenceBearing = getBearingAndDistance(POV_COORDS, CALIBRATION_TARGET_COORDS).bearing;
        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(p => { if (p === 'granted') calibrate(); }).catch(console.error);
            } else { calibrate(); }
        });
        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            if (camera && camera.object3D) {
                const currentYRotation = camera.object3D.rotation.y;
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                const offset = referenceBearing - currentHeading;
                world.setAttribute('rotation', `0 ${offset} 0`);
                document.querySelector('.ui-container').style.display = 'none';
                const calIndex = poisInScene.findIndex(p => p.isCalTarget);
                if (calIndex !== -1) {
                    poisInScene[calIndex].label2D.remove();
                    poisInScene.splice(calIndex, 1);
                }
            }
        }
    </script>
</body>
</html>

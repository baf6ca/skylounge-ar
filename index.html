<!DOCTYPE html>
<html>
<head>
    <title>Bosch Skylounge AR - Final</title>
    <meta name="description" content="Experiência de Realidade Aumentada no Skylounge da Bosch.">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #webcam { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        .ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; width: 90%; max-width: 400px; }
        .calibrate-button { padding: 14px 24px; background-color: #007BC0; color: white; border: none; border-radius: 8px; font-family: sans-serif; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
        .instructions { color: white; font-family: sans-serif; background-color: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline muted></video>

    <a-scene id="scene" vr-mode-ui="enabled: false" renderer="alpha: true" device-orientation-permission-ui="enabled: false">
        <a-camera look-controls="touchEnabled: false"></a-camera>
        <a-entity id="world"></a-entity>
    </a-scene>

    <div class="ui-container">
        <p class="instructions">Aponte a câmera para a Caixa d'água e clique abaixo para alinhar o mapa.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        // ===================================================================
        // ========== 1. CONFIGURAÇÃO DOS PONTOS GEOGRÁFICOS =============
        // ===================================================================

        // Ponto de Vista do Usuário (Onde você está no Skylounge)
        const POV_COORDS = { lat: -22.897997, lon: -47.115890 };
        
        // Ponto de Referência para Calibração (Bússola)
        const CALIBRATION_TARGET_COORDS = { lat: -22.89775, lon: -47.11475 }; // Caixa d'água

        // Lista de todos os pontos de interesse com suas coordenadas de Lat/Lon
        const POINTS_OF_INTEREST = [
            { name: "Caixa d'agua\n(Ponto de Calibração)", lat: -22.89775, lon: -47.11475, color: '#FFFF00', height: 5 },
            { name: "Biofuels Competence\nCenter", lat: -22.8973, lon: -47.1144, color: '#3CB371', height: 7 },
            { name: "Test Track", lat: -22.8967, lon: -47.114, color: '#A9A9A9', height: 8 },
            { name: "PS - Power Solutions", lat: -22.8964, lon: -47.1153, color: '#FF4500', height: 10 },
            { name: "VM - Vehicle Motion\n(Braking)", lat: -22.897, lon: -47.115, color: '#6A5ACD', height: 7 },
            { name: "SMAG", lat: -22.8974, lon: -47.1153, color: '#FFD700', height: 6 },
            { name: "Galvanic", lat: -22.8973, lon: -47.116, color: '#DA70D6', height: 7 },
            { name: "EM - Electrification\nShowroom", lat: -22.898, lon: -47.1165, color: '#00CED1', height: 8 },
            { name: "PT - Power Tools", lat: -22.8983, lon: -47.1175, color: '#005691', height: 10 },
            { name: "Vehicle Motion\n(Application Lab)", lat: -22.897, lon: -47.1168, color: '#6A5ACD', height: 7 },
            { name: "MA - Mobility\nAftermarket", lat: -22.8975, lon: -47.1173, color: '#ADD8E6', height: 7 },
            { name: "Logistic Center", lat: -22.8965, lon: -47.117, color: '#C71585', height: 10 },
            { name: "Preserved Area", lat: -22.8985, lon: -47.1185, color: '#228B22', height: 12 },
            { name: "Cantina", lat: -22.8986, lon: -47.1156, color: '#9400D3', height: 5 },
            { name: "MA - Automotive\nTraining Center", lat: -22.8988, lon: -47.115, color: '#1E90FF', height: 7 }
        ];

        // ===================================================================
        // =========== 2. CÁLCULOS GEOMÉTRICOS E CRIAÇÃO DO MUNDO ==========
        // ===================================================================

        // Função para calcular distância e ângulo (azimute) entre duas coordenadas
        function getBearingAndDistance(start, end) {
            const R = 6371e3; // Raio da Terra em metros
            const lat1 = start.lat * Math.PI / 180;
            const lat2 = end.lat * Math.PI / 180;
            const deltaLon = (end.lon - start.lon) * Math.PI / 180;

            const x = Math.cos(lat2) * Math.sin(deltaLon);
            const y = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(deltaLon);
            
            let bearing = Math.atan2(x, y) * 180 / Math.PI;
            bearing = (bearing + 360) % 360;

            const a = Math.sin((lat2-lat1)/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(deltaLon/2)**2;
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;

            return { bearing, distance };
        }

        // Função para converter coordenadas polares (distância, ângulo) para Cartesianas (X, Z)
        function toXZ(distance, bearing) {
            const angleRad = (bearing) * Math.PI / 180;
            const x = distance * Math.sin(angleRad);
            const z = -distance * Math.cos(angleRad);
            return { x, z };
        }
        
        // Processa e cria todos os pontos de interesse no mundo 3D
        function createPois() {
            const world = document.getElementById('world');
            POINTS_OF_INTEREST.forEach(poi => {
                const { bearing, distance } = getBearingAndDistance(POV_COORDS, poi);
                const { x, z } = toXZ(distance, bearing);

                let entity = document.createElement('a-entity');
                entity.setAttribute('position', `${x} 0 ${z}`);
                
                let textEl = document.createElement('a-text');
                textEl.setAttribute('value', poi.name);
                textEl.setAttribute('align', 'center');
                textEl.setAttribute('color', 'white');
                textEl.setAttribute('width', '50');
                textEl.setAttribute('wrap-count', '20');
                textEl.setAttribute('position', `0 ${poi.height} 0.1`);

                let planeEl = document.createElement('a-plane');
                planeEl.setAttribute('width', '14');
                planeEl.setAttribute('height', '4');
                planeEl.setAttribute('position', `0 ${poi.height} 0`);
                planeEl.setAttribute('color', 'black');
                planeEl.setAttribute('opacity', '0.8');

                let lineEl = document.createElement('a-cylinder');
                lineEl.setAttribute('height', poi.height);
                lineEl.setAttribute('radius', '0.12');
                lineEl.setAttribute('color', poi.color);
                lineEl.setAttribute('position', `0 ${poi.height / 2} 0`);
                
                entity.appendChild(planeEl);
                entity.appendChild(textEl);
                entity.appendChild(lineEl);
                world.appendChild(entity);
            });
        }
        
        createPois(); // Cria o mundo assim que a página carrega

        // ===================================================================
        // =============== 3. LÓGICA DA CÂMERA E CALIBRAÇÃO ================
        // ===================================================================

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { alert("Ative a câmera para rodar a experiência de AR."); });

        const referenceBearing = getBearingAndDistance(POV_COORDS, CALIBRATION_TARGET_COORDS).bearing;

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(p => { if (p === 'granted') calibrate(); }).catch(console.error);
            } else { calibrate(); }
        });

        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            if (camera && camera.object3D) {
                const currentYRotation = camera.object3D.rotation.y;
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                
                const offset = referenceBearing - currentHeading; // Fórmula simplificada e mais precisa
                
                world.setAttribute('rotation', `0 ${offset} 0`);
                document.querySelector('.ui-container').style.display = 'none';
            }
        }
    </script>
</body>
</html>

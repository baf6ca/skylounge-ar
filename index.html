<!DOCTYPE html>
<html>
<head>
    <title>Bosch Skylounge AR</title>
    <meta name="description" content="Experiência de Realidade Aumentada no Skylounge da Bosch.">
    <!-- Importa a biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        
        /* Câmera do celular em tela cheia no fundo do site */
        #webcam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* Interface do Usuário */
        .ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .calibrate-button {
            padding: 14px 24px;
            background-color: #007BC0; /* Azul Bosch */
            color: white;
            border: none;
            border-radius: 8px;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
        }
        .instructions {
            color: white;
            font-family: sans-serif;
            background-color: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Vídeo da câmera real -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Cena 3D -->
    <a-scene vr-mode-ui="enabled: false" renderer="alpha: true" device-orientation-permission-ui="enabled: false">
        
        <a-camera look-controls="touchEnabled: false"></a-camera>

        <a-entity id="world">
            
            <!-- PONTO DE CALIBRAÇÃO (Estará bem no centro da sua tela ao calibrar!) -->
            <!-- Posição: X=0 (Centro), Y=0 (Altura dos olhos), Z=-30 (30 metros de distância) -->
            <a-entity position="0 0 -30">
                <a-text 
                    value="[ALVO REAL DE CALIBRACAO]"
                    align="center"
                    color="yellow"
                    width="25"
                    position="0 2.5 0">
                </a-text>
                <a-circle color="yellow" radius="1.2" opacity="0.9"></a-circle>
            </a-entity>

            <!-- PONTO DE INTERESSE: Digihub (Virado para o outro lado) -->
            <a-entity position="0 0 50">
                <a-text 
                    value="Digihub"
                    align="center"
                    color="white"
                    width="30"
                    position="0 2 0">
                </a-text>
                <a-circle color="#8A2BE2" radius="1.5" opacity="0.8"></a-circle>
            </a-entity>

            <!-- PONTO DE INTERESSE: Power Tools -->
            <a-entity position="-45 0 20">
                <a-text 
                    value="PT - Power Tools"
                    align="center"
                    color="white"
                    width="30"
                    position="0 2 0">
                </a-text>
                <a-circle color="#4682B4" radius="1.5" opacity="0.8"></a-circle>
            </a-entity>

        </a-entity>
    </a-scene>

    <!-- Interface -->
    <div class="ui-container">
        <p class="instructions">Aponte a câmera para a sua Referência Física Real (ex: Portaria) e clique abaixo.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        // Câmera traseira
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" }, 
            audio: false 
        })
        .then(stream => {
            const video = document.getElementById('webcam');
            video.srcObject = stream;
            video.play();
        })
        .catch(err => {
            alert("Ative a câmera para rodar a experiência de AR.");
        });

        // LÓGICA DE CALIBRAÇÃO CORRIGIDA (Inversão de rotação)
        const REFERENCE_HEADING = 180; // Configure o grau real da sua bússola para o ponto de referência aqui!

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            calibrate();
                        }
                    })
                    .catch(console.error);
            } else {
                calibrate();
            }
        });

        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            
            if (camera && camera.object3D) {
                // Rotação Y em radianos fornecida pelo A-Frame
                const currentYRotation = camera.object3D.rotation.y;
                
                // Converte para graus
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                
                // CORREÇÃO DE 180 GRAUS (Inversão do cálculo de rotação)
                // Se estava deslocado em 180 graus, invertemos a compensação:
                const offset = REFERENCE_HEADING + currentHeading; 

                // Aplica a nova rotação corrigida
                world.setAttribute('rotation', `0 ${offset} 0`);

                document.querySelector('.ui-container').style.display = 'none';
            } else {
                alert("Carregando sensores...");
            }
        }
    </script>
</body>
</html>

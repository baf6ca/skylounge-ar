<!DOCTYPE html>
<html>
<head>
    <title>Bosch Skylounge AR</title>
    <meta name="description" content="Experiência de Realidade Aumentada no Skylounge da Bosch.">
    <!-- Importa a biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #webcam { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        .ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; width: 90%; max-width: 400px; }
        .calibrate-button { padding: 14px 24px; background-color: #007BC0; color: white; border: none; border-radius: 8px; font-family: sans-serif; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
        .instructions { color: white; font-family: sans-serif; background-color: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline muted></video>

    <a-scene vr-mode-ui="enabled: false" renderer="alpha: true" device-orientation-permission-ui="enabled: false">
        <a-camera look-controls="touchEnabled: false"></a-camera>

        <a-entity id="world">
            
            <!-- PONTO DE REFERÊNCIA (CALIBRAÇÃO) -->
            <a-entity position="0 1 -60">
                <a-text value="[Mire na Caixa d'agua e clique para CALIBRAR]" align="center" color="yellow" width="25" position="0 2.5 0"></a-text>
                <a-circle color="yellow" radius="1.2" opacity="0.9"></a-circle>
            </a-entity>

            <!-- ======================================================= -->
            <!-- ======== PONTOS DE INTERESSE MAPEADOS (TODOS) ========= -->
            <!-- ======================================================= -->

            <!-- Test Track: Bem à esquerda e longe -->
            <a-entity position="-70 1 -120">
                <a-text value="Test Track" align="center" color="white" width="30" position="0 2.5 0"></a-text>
                <a-circle color="#A9A9A9" radius="2" opacity="0.8"></a-circle>
            </a-entity>

            <!-- Biofuels Competence Center: Quase no centro -->
            <a-entity position="-10 2 -70">
                <a-text value="Biofuels Competence Center" align="center" color="white" width="25" position="0 3 0"></a-text>
                <a-box color="#3CB371" width="12" height="4" depth="1" opacity="0.7"></a-box>
            </a-entity>
            
            <!-- Cantina: À direita e mais perto -->
            <a-entity position="25 0 -50">
                <a-text value="Cantina" align="center" color="white" width="30" position="0 3 0"></a-text>
                <a-box color="#9400D3" width="15" height="5" depth="1" opacity="0.7"></a-box>
            </a-entity>

            <!-- MA - Automotive Training Center: Bem à direita -->
            <a-entity position="60 0 -70">
                <a-text value="MA - Automotive Training Center" align="center" color="white" width="30" position="0 3 0"></a-text>
                <a-box color="#1E90FF" width="12" height="5" depth="1" opacity="0.7"></a-box>
            </a-entity>

            <!-- PT - Power Tools: Longe e à esquerda -->
            <a-entity position="-100 0 -100">
                <a-text value="PT - Power Tools" align="center" color="white" width="40" position="0 5 0"></a-text>
                <a-box color="#005691" width="20" height="8" depth="1" opacity="0.7"></a-box>
            </a-entity>

            <!-- Logistic Center: Bem longe e à esquerda -->
            <a-entity position="-120 2 -150">
                <a-text value="Logistic Center" align="center" color="white" width="35" position="0 3 0"></a-text>
                <a-box color="#C71585" width="15" height="4" depth="1" opacity="0.7"></a-box>
            </a-entity>
            
            <!-- Preserved Area: Extrema esquerda -->

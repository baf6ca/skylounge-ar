<!DOCTYPE html>
<html>
<head>
    <title>Bosch Skylounge AR</title>
    <meta name="description" content="Experiência de Realidade Aumentada no Skylounge da Bosch.">
    <!-- Importa a biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        
        /* Câmera do celular em tela cheia no fundo do site */
        #webcam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1; /* Fica atrás dos pontos 3D */
        }

        /* Interface do Usuário */
        .ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .calibrate-button {
            padding: 14px 24px;
            background-color: #007BC0; /* Azul Bosch */
            color: white;
            border: none;
            border-radius: 8px;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
        }
        .instructions {
            color: white;
            font-family: sans-serif;
            background-color: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Elemento de Vídeo que vai transmitir a câmera real do celular -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- A Cena de Realidade Aumentada (transparente para mostrar a câmera atrás) -->
    <a-scene vr-mode-ui="enabled: false" renderer="alpha: true" device-orientation-permission-ui="enabled: false">
        
        <!-- Câmera virtual que segue o movimento do celular (giroscópio) sem arrastar o dedo -->
        <a-camera look-controls="touchEnabled: false"></a-camera>

        <!-- "Mundo Virtual" que agrupa os pontos. Giramos ele ao calibrar -->
        <a-entity id="world">
            
            <!-- PONTO DE TESTE 1: Digihub -->
            <a-entity position="-15 0 -50">
                <a-text 
                    value="Digihub"
                    align="center"
                    color="white"
                    width="30"
                    position="0 2 0">
                </a-text>
                <a-circle color="#8A2BE2" radius="1.5" opacity="0.8"></a-circle>
            </a-entity>

            <!-- PONTO DE TESTE 2: Power Tools -->
            <a-entity position="50 0 -10">
                <a-text 
                    value="PT - Power Tools"
                    align="center"
                    color="white"
                    width="30"
                    position="0 2 0">
                </a-text>
                <a-circle color="#4682B4" radius="1.5" opacity="0.8"></a-circle>
            </a-entity>

            <!-- PONTO DE TESTE 3: Estrada para SP -->
            <a-entity position="0 0 50">
                <a-text 
                    value="Rodovia para SP"
                    align="center"
                    color="white"
                    width="30"
                    position="0 2 0">
                </a-text>
                <a-circle color="#228B22" radius="1.5" opacity="0.8"></a-circle>
            </a-entity>

        </a-entity>
    </a-scene>

    <!-- Interface do Usuário -->
    <div class="ui-container">
        <p class="instructions">Aponte para o ponto de referência e clique no botão abaixo para calibrar a vista.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        // --- 1. ATIVAR A CÂMERA TRASEIRA NO FUNDO ---
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "environment", 
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }, 
            audio: false 
        })
        .then(stream => {
            const video = document.getElementById('webcam');
            video.srcObject = stream;
            video.play();
        })
        .catch(err => {
            console.error("Erro ao acessar a câmera: ", err);
            alert("Erro de câmera. Garanta que permitiu o acesso à câmera nas configurações do navegador do celular.");
        });

        // --- 2. LÓGICA DE CALIBRAÇÃO ---
        const REFERENCE_HEADING = 180; // Configure o grau da bússola do seu ponto de referência aqui!

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            // Solicitação de permissão de giroscópio (Obrigatória em iPhones/iOS)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            calibrate();
                        } else {
                            alert("Permissão de giroscópio negada. Os pontos não poderão seguir o movimento do celular.");
                        }
                    })
                    .catch(console.error);
            } else {
                // Em dispositivos Android, calibra diretamente
                calibrate();
            }
        });

        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            
            if (camera && camera.object3D) {
                // Obtém a rotação atual do eixo Y (giroscópio)
                const currentYRotation = camera.object3D.rotation.y;
                // Converte radianos para graus manualmente
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                // Calcula o desvio
                const offset = REFERENCE_HEADING - currentHeading;

                // Rotaciona o mundo inteiro para calibrar
                world.setAttribute('rotation', `0 ${offset} 0`);

                // Oculta os botões para limpar a tela
                document.querySelector('.ui-container').style.display = 'none';
            } else {
                alert("O sistema 3D ainda está carregando. Aguarde 2 segundos e tente de novo.");
            }
        }
    </script>
</body>
</html>

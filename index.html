<!DOCTYPE html>
<html>
<head>
    <title>Bosch Skylounge AR</title>
    <meta name="description" content="Experiência de Realidade Aumentada no Skylounge da Bosch.">
    <!-- Importa a biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        
        /* Câmera do celular em tela cheia no fundo do site */
        #webcam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* Interface do Usuário */
        .ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .calibrate-button {
            padding: 14px 24px;
            background-color: #007BC0; /* Azul Bosch */
            color: white;
            border: none;
            border-radius: 8px;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
        }
        .instructions {
            color: white;
            font-family: sans-serif;
            background-color: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Vídeo da câmera real -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Cena 3D -->
    <a-scene vr-mode-ui="enabled: false" renderer="alpha: true" device-orientation-permission-ui="enabled: false">
        
        <a-camera look-controls="touchEnabled: false"></a-camera>

        <a-entity id="world">
            
            <!-- PONTO DE REFERÊNCIA PARA CALIBRAR (Aponte para a Caixa d'água) -->
            <a-entity position="0 1 -60">
                <a-text 
                    value="[Mire na Caixa d'agua e clique para CALIBRAR]"
                    align="center"
                    color="yellow"
                    width="25"
                    position="0 2.5 0">
                </a-text>
                <a-circle color="yellow" radius="1.2" opacity="0.9"></a-circle>
            </a-entity>

            <!-- ======================================================= -->
            <!-- ======== PONTOS DE INTERESSE DA VISTA ATUAL ========= -->
            <!-- ======================================================= -->

            <!-- Test Track -->
            <!-- Coordenadas: Bem à esquerda (-45) e mais longe (-100) -->
            <a-entity position="-45 1 -100">
                <a-text value="Test Track" align="center" color="white" width="30" position="0 2.5 0"></a-text>
                <a-circle color="#CCCCCC" radius="2" opacity="0.8"></a-circle>
            </a-entity>

            <!-- Biofuels Competence Center -->
            <!-- Coordenadas: Quase no centro, um pouco à esquerda (-5) e distância média (-65) -->
            <a-entity position="-5 2 -65">
                <a-text value="Biofuels Competence Center" align="center" color="white" width="25" position="0 3 0"></a-text>
                <a-box color="#3CB371" width="10" height="4" depth="1" opacity="0.7"></a-box>
            </a-entity>

            <!-- Cantina -->
            <!-- Coordenadas: À direita (25) e mais perto (-50) -->
            <a-entity position="25 0 -50">
                <a-text value="Cantina" align="center" color="white" width="30" position="0 3 0"></a-text>
                <a-box color="#9400D3" width="12" height="5" depth="1" opacity="0.7"></a-box>
            </a-entity>

            <!-- MA - Automotive Training Center -->
            <!-- Coordenadas: Bem à direita (50) e distância média (-70) -->
            <a-entity position="50 0 -70">
                <a-text value="MA - Automotive Training Center" align="center" color="white" width="30" position="0 3 0"></a-text>
                <a-box color="#1E90FF" width="10" height="5" depth="1" opacity="0.7"></a-box>
            </a-entity>

        </a-entity>
    </a-scene>

    <!-- Interface -->
    <div class="ui-container">
        <p class="instructions">Aponte a câmera para a Caixa d'água e clique abaixo para calibrar a vista.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        // --- Ativa a câmera traseira no fundo ---
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" }, 
            audio: false 
        })
        .then(stream => {
            const video = document.getElementById('webcam');
            video.srcObject = stream;
            video.play();
        })
        .catch(err => {
            alert("Ative a câmera para rodar a experiência de AR.");
        });

        // --- Lógica de Calibração Corrigida ---
        const REFERENCE_HEADING = 180; // IMPORTANTE: Altere este valor para o grau real da bússola ao apontar para a Caixa d'água!

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            calibrate();
                        }
                    })
                    .catch(console.error);
            } else {
                calibrate();
            }
        });

        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            
            if (camera && camera.object3D) {
                const currentYRotation = camera.object3D.rotation.y;
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                const offset = REFERENCE_HEADING + currentHeading; 

                world.setAttribute('rotation', `0 ${offset} 0`);
                document.querySelector('.ui-container').style.display = 'none';
            } else {
                alert("Carregando sensores... Tente de novo em 2 segundos.");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bosch Skylounge AR - Versão Estável 2D</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #webcam { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        
        /* CSS para as Placas 2D Flutuantes (Absolutamente de frente e legíveis!) */
        .poi-label {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.85); /* Fundo preto 15% transparente */
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            white-space: pre-line;
            text-align: center;
            pointer-events: none;
            z-index: 5;
            transform: translate(-50%, -100%); /* Centraliza na ponta da linha */
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: none; /* Só mostra se o prédio estiver na tela */
        }

        /* SVG para desenhar as linhas conectoras grossas por cima de tudo */
        #svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 4;
        }

        /* Interface de Calibração */
        .ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; width: 90%; max-width: 400px; }
        .calibrate-button { padding: 14px 24px; background-color: #007BC0; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
        .instructions { color: white; background-color: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Canvas SVG para desenhar as linhas conectoras na tela -->
    <svg id="svg-overlay"></svg>

    <!-- Div para abrigar as placas HTML 2D -->
    <div id="labels-container"></div>

    <a-scene id="scene" vr-mode-ui="enabled: false" renderer="alpha: true" device-orientation-permission-ui="enabled: false">
        <a-camera id="user-camera" look-controls="touchEnabled: false"></a-camera>
        <a-entity id="world"></a-entity>
    </a-scene>

    <div class="ui-container">
        <p class="instructions">Aponte a câmera para a Caixa d'água e clique abaixo para alinhar o mapa.</p>
        <button id="calibrateBtn" class="calibrate-button">Calibrar Vista</button>
    </div>

    <script>
        // ===================================================================
        // ========== 1. CONFIGURAÇÃO GEOGRÁFICA (SUAS COORDENADAS) ==========
        // ===================================================================
        const POV_COORDS = { lat: -22.897966, lon: -47.115815 };
        const CALIBRATION_TARGET_COORDS = { lat: -22.897553, lon: -47.113375 };
        
        const POINTS_OF_INTEREST = [
            { name: "Caixa d'agua\n(Ponto de Calibração)", lat: -22.897553, lon: -47.113375, color: '#FFFF00', height: 4.5, id: 'calibrationTarget' },
            { name: "Biofuels Competence\nCenter", lat: -22.897342, lon: -47.112256, color: '#3CB371', height: 6 },
            { name: "Test Track", lat: -22.896887, lon: -47.111570, color: '#A9A9A9', height: 7 },
            { name: "Cantina", lat: -22.898064, lon: -47.114763, color: '#9400D3', height: 4.5 },
            { name: "MA - Automotive\nTraining Center", lat: -22.898384, lon: -47.114872, color: '#1E90FF', height: 6 },
            { name: "PT - Power Tools", lat: -22.897240, lon: -47.115682, color: '#005691', height: 8 },
            { name: "Logistic Center", lat: -22.894913, lon: -47.115306, color: '#C71585', height: 8 },
            { name: "Preserved Area", lat: -22.896832, lon: -47.117176, color: '#228B22', height: 10 },
            { name: "VM - Vehicle Motion\nLabs", lat: -22.895896, lon: -47.114976, color: '#6A5ACD', height: 6 },
            { name: "PS - Power Solutions", lat: -22.895686, lon: -47.112905, color: '#FF4500', height: 8 },
            { name: "EM - Electrification\nShowroom", lat: -22.896867, lon: -47.114718, color: '#00CED1', height: 7 },
            { name: "SMAG", lat: -22.896846, lon: -47.113732, color: '#FFD700', height: 5.5 },
            { name: "MA - Mobility\nAftermarket", lat: -22.895945, lon: -47.116061, color: '#ADD8E6', height: 6 },
            { name: "Galvanic", lat: -22.895672, lon: -47.114027, color: '#DA70D6', height: 6 },
            { name: "Bosch Digital, Human\nResources, Service\nSolutions, Bosch\nTraining Center,\nAmbulatory", lat: -22.897929, lon: -47.113593, color: '#87CEEB', height: 5.5 }
        ];

        // ===================================================================
        // =========== 2. PROCESSAMENTO GEOMÉTRICO (TRIGONOMETRIA) ===========
        // ===================================================================
        function getBearingAndDistance(start, end) { 
            const R = 6371e3; 
            const lat1 = start.lat * Math.PI / 180, lat2 = end.lat * Math.PI / 180; 
            const dLon = (end.lon - start.lon) * Math.PI / 180;
            const x = Math.cos(lat2) * Math.sin(dLon); 
            const y = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            let bearing = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
            const a = Math.sin((lat2-lat1)/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon/2)**2;
            return { bearing, distance: R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)) };
        }
        
        function toXZ(d, b) { 
            const a = b * Math.PI / 180; 
            return { x: d * Math.sin(a), z: -d * Math.cos(a) }; 
        }

        const poisInScene = [];

        function createPois() {
            const world = document.getElementById('world');
            const labelsContainer = document.getElementById('labels-container');

            POINTS_OF_INTEREST.forEach((poi, index) => {
                const { bearing, distance } = getBearingAndDistance(POV_COORDS, poi);
                const { x, z } = toXZ(distance, bearing);

                // Criamos dois pontos virtuais invisíveis: a base no chão (anchor) e o topo (tip)
                let anchor = document.createElement('a-entity');
                anchor.setAttribute('position', `${x} 0 ${z}`);
                if (poi.id) anchor.id = poi.id;
                
                let tip = document.createElement('a-entity');
                tip.setAttribute('position', `0 ${poi.height} 0`);
                anchor.appendChild(tip);
                world.appendChild(anchor);

                // Criamos a caixinha HTML 2D correspondente
                let labelDiv = document.createElement('div');
                labelDiv.className = 'poi-label';
                labelDiv.id = `label-${index}`;
                labelDiv.textContent = poi.name;
                labelsContainer.appendChild(labelDiv);

                // Salvamos as referências 3D e 2D para usar no atualizador de tela
                poisinScene.push({
                    anchor3D: anchor.object3D,
                    tip3D: tip.object3D,
                    label2D: labelDiv,
                    color: poi.color,
                    isCalTarget: !!poi.id
                });
            });
        }
        
        createPois();

        // ===================================================================
        // ========== 3. PROJEÇÃO DE TELA EM REAL TIME (60 FPS) ==============
        // ===================================================================
        const sceneEl = document.getElementById('scene');
        const svgEl = document.getElementById('svg-overlay');
        const cameraEl = document.getElementById('user-camera');

        let cameraThree, widthHalf, heightHalf;

        sceneEl.addEventListener('render-target-loaded', () => {
            cameraThree = cameraEl.getObject3D('camera');
        });

        function updatePositions() {
            if (!cameraThree || poisInScene.length === 0) {
                requestAnimationFrame(updatePositions);
                return;
            }

            // Atualiza dimensões da tela do celular
            const width = window.innerWidth;
            const height = window.innerHeight;
            widthHalf = width / 2;
            heightHalf = height / 2;

            // Limpa as linhas SVG antigas do frame anterior
            svgEl.innerHTML = '';

            poisinScene.forEach(poi => {
                // Força o Three.js a calcular a posição atualizada considerando a calibração
                poi.anchor3D.updateMatrixWorld();
                poi.tip3D.updateMatrixWorld();

                let posAnchor = new THREE.Vector3();
                let posTip = new THREE.Vector3();

                posAnchor.setFromMatrixPosition(poi.anchor3D.matrixWorld);
                posTip.setFromMatrixPosition(poi.tip3D.matrixWorld);

                // Verifica se o objeto está na frente da câmera (Z negativo no espaço de câmera)
                let tempV = posAnchor.clone().project(cameraThree);
                
                if (tempV.z < 1) { // Objeto está no campo de visão!
                    // Projeta as coordenadas 3D para pixels 2D da tela do celular
                    let anchor2D = projectToScreen(posAnchor);
                    let tip2D = projectToScreen(posTip);

                    // 1. Posiciona o Box HTML 2D no topo da linha
                    poi.label2D.style.display = 'block';
                    poi.label2D.style.left = `${tip2D.x}px`;
                    poi.label2D.style.top = `${tip2D.y}px`;

                    // 2. Desenha a linha conetora grossa em SVG entre a base e o texto
                    let svgLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    svgLine.setAttribute('x1', anchor2D.x);
                    svgLine.setAttribute('y1', anchor2D.y);
                    svgLine.setAttribute('x2', tip2D.x);
                    svgLine.setAttribute('y2', tip2D.y);
                    svgLine.setAttribute('stroke', poi.color);
                    svgLine.setAttribute('stroke-width', '4'); // Linha super visível e grossa!
                    svgLine.setAttribute('stroke-linecap', 'round');
                    svgEl.appendChild(svgLine);
                } else {
                    // Se o prédio estiver nas suas costas, esconde a placa
                    poi.label2D.style.display = 'none';
                }
            });

            requestAnimationFrame(updatePositions);
        }

        function projectToScreen(vec3) {
            let p = vec3.clone().project(cameraThree);
            return {
                x: (p.x * widthHalf) + widthHalf,
                y: -(p.y * heightHalf) + heightHalf
            };
        }

        // Inicializa o loop de projeção
        requestAnimationFrame(updatePositions);

        // ===================================================================
        // =============== 4. LÓGICA DA CÂMERA E CALIBRAÇÃO ================
        // ===================================================================
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { alert("Ative a câmera para rodar a experiência de AR."); });

        const referenceBearing = getBearingAndDistance(POV_COORDS, CALIBRATION_TARGET_COORDS).bearing;

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(p => { if (p === 'granted') calibrate(); }).catch(console.error);
            } else { calibrate(); }
        });

        function calibrate() {
            const camera = document.querySelector('a-camera');
            const world = document.getElementById('world');
            if (camera && camera.object3D) {
                const currentYRotation = camera.object3D.rotation.y;
                const currentHeading = (currentYRotation * 180 / Math.PI) % 360;
                const offset = referenceBearing - currentHeading;
                world.setAttribute('rotation', `0 ${offset} 0`);
                
                document.querySelector('.ui-container').style.display = 'none';
                
                // Remove o balão de calibração amarela da cena
                const calIndex = poisInScene.findIndex(p => p.isCalTarget);
                if (calIndex !== -1) {
                    poisinScene[calIndex].label2D.style.display = 'none';
                    poisinScene[calIndex].label2D.remove();
                    poisinScene.splice(calIndex, 1);
                }
            }
        }
    </script>
</body>
</html>
